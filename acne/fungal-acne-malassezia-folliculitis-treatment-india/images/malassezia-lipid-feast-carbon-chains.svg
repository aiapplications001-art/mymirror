<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 28px; fill: #1A1410; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 15px; fill: #5C4A3A; }
      .sec-head { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 15px; }
      .badge-txt { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
      .card-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 17px; }
      .card-item { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #2D241E; }
      .card-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #786555; }
      .footer-txt { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13.5px; fill: #1A1410; }
    </style>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#FAF8F5" />

  <!-- Main Card -->
  <rect x="40" y="30" width="1120" height="615" rx="16" fill="#FFFFFF" stroke="#E8DDD5" stroke-width="1.5" filter="url(#soft-shadow)" />

  <!-- Header -->
  <rect x="70" y="58" width="160" height="26" rx="13" fill="#FFF3EB" />
  <text x="150" y="75" text-anchor="middle" class="badge-txt" fill="#C14800">BIOCHEMICAL GUIDE</text>
  <text x="70" y="115" class="title">The Lipid Feast: Carbon Chain Lengths vs. Malassezia</text>
  <text x="70" y="142" class="subtitle">Why Malassezia yeast multiplies on C11–C24 fatty acids and starves on pure squalane &amp; humectants</text>

  <!-- SPECTRUM BAR CONTAINER -->
  <rect x="70" y="170" width="1060" height="135" rx="12" fill="#F9F6F3" stroke="#E8DDD5" stroke-width="1" />

  <!-- Spectrum Segment 1: C1-C10 Safe -->
  <rect x="85" y="185" width="220" height="105" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" />
  <circle cx="108" cy="208" r="10" fill="#059669" />
  <text x="108" y="212" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11">✓</text>
  <text x="126" y="213" class="sec-head" fill="#065F46">C1 – C10 : SAFE</text>
  <text x="100" y="235" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">Short-Chain Molecules</text>
  <text x="100" y="254" font-family="sans-serif" font-size="11.5" fill="#065F46">Too short for yeast cell walls</text>
  <text x="100" y="272" font-family="sans-serif" font-size="11" fill="#047857" font-weight="600">Glycerin, Propylene Glycol, Water</text>

  <!-- Spectrum Segment 2: C11-C24 DANGER ZONE -->
  <rect x="320" y="185" width="560" height="105" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="2" />
  <circle cx="345" cy="208" r="10" fill="#E11D48" />
  <text x="345" y="212" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11">✕</text>
  <text x="365" y="213" class="sec-head" fill="#9F1239">C11 – C24 : DANGER ZONE (YEAST FEAST)</text>
  <text x="345" y="235" font-family="sans-serif" font-size="12" font-weight="700" fill="#BE123C">Malassezia lacks fatty acid synthase; scavenges this exact range</text>
  <text x="345" y="254" font-family="sans-serif" font-size="11.5" fill="#881337">Lauric (C12), Myristic (C14), Palmitic (C16), Stearic (C18), Oleic (C18:1)</text>
  <text x="345" y="272" font-family="sans-serif" font-size="11" fill="#9F1239" font-weight="600">Coconut Oil, Almond Oil, Olive Oil, Isopropyl Myristate, Polysorbates</text>

  <!-- Spectrum Segment 3: C25+ Safe -->
  <rect x="895" y="185" width="220" height="105" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" />
  <circle cx="918" cy="208" r="10" fill="#059669" />
  <text x="918" y="212" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11">✓</text>
  <text x="936" y="213" class="sec-head" fill="#065F46">C25+ : SAFE</text>
  <text x="910" y="235" font-family="sans-serif" font-size="12" font-weight="700" fill="#047857">Long Hydrocarbons</text>
  <text x="910" y="254" font-family="sans-serif" font-size="11.5" fill="#065F46">Too long for yeast enzymes</text>
  <text x="910" y="272" font-family="sans-serif" font-size="11" fill="#047857" font-weight="600">100% Plant Squalane (C30)</text>

  <!-- COMPARISON CARDS BELOW -->
  <!-- Left Card: Avoid -->
  <rect x="70" y="325" width="515" height="225" rx="12" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5" />
  <rect x="90" y="345" width="475" height="32" rx="6" fill="#FEE2E2" />
  <text x="105" y="366" class="card-title" fill="#991B1B">🚫 Fuels Fungal Acne (Avoid Completely)</text>

  <g transform="translate(95, 395)">
    <text x="0" y="0" class="card-item">• <tspan font-weight="700">Coconut Oil (C12 Lauric ~50%):</tspan> Heavy champi oil dripping onto forehead</text>
    <text x="0" y="26" class="card-item">• <tspan font-weight="700">Almond &amp; Olive Oil (C18 Oleic):</tspan> Rich facial oils that accelerate yeast colonies</text>
    <text x="0" y="52" class="card-item">• <tspan font-weight="700">Esters (Ending in -ate):</tspan> Isopropyl Myristate, Glyceryl Stearate, Cetyl Palmitate</text>
    <text x="0" y="78" class="card-item">• <tspan font-weight="700">Polysorbate Emulsifiers:</tspan> Polysorbate 20, 40, 60, and 80 in rich night creams</text>
    <text x="0" y="104" class="card-item">• <tspan font-weight="700">Traditional Butters:</tspan> Shea Butter and Cocoa Butter packed with C16–C18 lipids</text>
  </g>

  <!-- Right Card: Safe -->
  <rect x="615" y="325" width="515" height="225" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
  <rect x="635" y="345" width="475" height="32" rx="6" fill="#DCFCE7" />
  <text x="650" y="366" class="card-title" fill="#166534">✅ 100% Yeast-Safe Hydrators (Use Freely)</text>

  <g transform="translate(640, 395)">
    <text x="0" y="0" class="card-item">• <tspan font-weight="700">100% Plant Squalane Oil (C30):</tspan> Hydrocarbon structure yeast cannot digest</text>
    <text x="0" y="26" class="card-item">• <tspan font-weight="700">Hyaluronic Acid:</tspan> Pure sugar humectant molecule with zero fatty acids</text>
    <text x="0" y="52" class="card-item">• <tspan font-weight="700">Pure Aloe Vera &amp; Panthenol (B5):</tspan> Soothes redness without feeding yeast</text>
    <text x="0" y="78" class="card-item">• <tspan font-weight="700">Pure Glycerin (C3):</tspan> Clean water-binding humectant outside fungal enzyme reach</text>
    <text x="0" y="104" class="card-item">• <tspan font-weight="700">Water-Gel Moisturizers:</tspan> 100% oil-free, ester-free formulations like Sebamed Gel</text>
  </g>

  <!-- Bottom Dermatologist Callout -->
  <rect x="70" y="565" width="1060" height="52" rx="8" fill="#FFF3EB" stroke="#FFD8BE" stroke-width="1" />
  <text x="90" y="596" class="footer-txt">💡 <tspan fill="#C14800" font-weight="800">Dermatology Core Rule:</tspan> Malassezia yeast cannot make its own fat. Starve the yeast of C11–C24 lipids, and colonies clear in 2 to 3 weeks.</text>
</svg>